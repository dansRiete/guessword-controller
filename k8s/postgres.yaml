apiVersion: apps/v1
kind: Deployment
metadata:
  name: guessword-db
  namespace: guessword
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: guessword-db
  template:
    metadata:
      labels:
        app: guessword-db
    spec:
      containers:
        - name: postgres
          image: postgres:14.5
          ports:
            - containerPort: 5432
              hostPort: 24869
          env:
            - name: POSTGRES_USER
              value: guessword
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guessword-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          hostPath:
            path: /home/alexkzk/guessword/docker/postgresql
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: guessword-db
  namespace: guessword
spec:
  selector:
    app: guessword-db
  ports:
    - port: 5432
      targetPort: 5432
