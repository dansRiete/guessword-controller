name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/dansriete/guessword-controller
          docker build --no-cache -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: /home/alexkzk/.kube/config
        run: |
          kubectl set image deployment/guessword-controller \
            guessword-controller=ghcr.io/dansriete/guessword-controller:${{ github.sha }} \
            -n guessword
          kubectl rollout status deployment/guessword-controller -n guessword --timeout=300s
