spring:
  application:
    name: guessword-2
#  liquibase:
#    liquibase-schema: liquibase
#    change-log: classpath:db/changelog.xml
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  servlet:
    context-path: /api

qservice:
  max-retry-attempts: 100
  index-error: 0.95
  learned-margin: 3
  randomizer-factor: 1.75
  index-max-range: 1000000
  active-questions: 1000
  non-repeatable-questions: 300

logging:
  file:
    enabled: true
    path: /var/log/guessword
    max-history: 90
  level:
    root: info
    com.guessword: debug

question-engine:
  study-points-multiplier: 5