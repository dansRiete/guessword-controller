

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://192.168.0.201:24869/guessword
    username: guessword
    password: guessword
  application:
    name: guessword-2
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

