buildscript {
    ext {
        springVersion = '2.2.6.RELEASE'
        lombokVersion = '1.18.12'
        mapstructVersion = "1.3.1.Final"
    }
}

plugins {
    id 'net.ltgt.apt' version '0.8'
    id 'java'
    id 'org.springframework.boot' version "${springVersion}"
    id "io.freefair.lombok" version "5.0.0-rc6"
}

group 'com.guessword'
version '20-001'

apply plugin: 'java'
apply plugin: 'io.spring.dependency-management'

bootJar {
    mainClassName = 'com.guessword.GuesswordApplication'
}

repositories {
    mavenCentral()
    mavenLocal()
}

sourceCompatibility = JavaVersion.VERSION_11

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    compile group: 'org.springframework.boot', name: 'spring-boot', version: "${springVersion}"
    compile group: 'org.apache.commons', name: 'commons-lang3', version: '3.10'
    compile group: 'org.apache.commons', name: 'commons-collections4', version: '4.3'
    compile group: 'org.apache.tomcat', name: 'tomcat-jdbc', version: '9.0.27'
    compile group: 'org.postgresql', name: 'postgresql', version: '42.2.26'
    compile group: 'org.springframework.boot', name: 'spring-boot-starter-jdbc', version: "${springVersion}"
    compile group: 'com.google.guava', name: 'guava', version: '30.0-android'
    compile group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jsr310', version: '2.10.0'
    compile group: 'mysql', name: 'mysql-connector-java', version: '8.0.28'
    compile group: 'log4j', name: 'log4j', version: '1.2.17'
    compile group: 'org.codehaus.janino', name: 'janino', version: '3.1.2'
    compile group: 'org.springframework.boot', name: 'spring-boot-devtools', version: '2.3.5.RELEASE'
    compile group: 'org.springframework.boot', name: 'spring-boot-starter-thymeleaf', version: '2.3.5.RELEASE'


    testCompile group: 'junit', name: 'junit', version: '4.13.1'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
}

tasks.withType(JavaCompile) {
    options.compilerArgs = [
            '-Amapstruct.suppressGeneratorTimestamp=true', '-Amapstruct.defaultComponentModel=spring'
    ]
}

targetCompatibility = JavaVersion.VERSION_11
